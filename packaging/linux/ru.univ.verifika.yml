app-id: ru.univ.verifika
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: verifika

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver

modules:
  - name: verifika
    buildsystem: simple
    build-commands:
      - install -Dm755 verifika /app/bin/verifika
      - install -Dm644 ru.univ.verifika.desktop /app/share/applications/ru.univ.verifika.desktop
      - install -Dm644 ru.univ.verifika.metainfo.xml /app/share/metainfo/ru.univ.verifika.metainfo.xml
      - install -Dm644 32x32.png /app/share/icons/hicolor/32x32/apps/ru.univ.verifika.png
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/ru.univ.verifika.png
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/ru.univ.verifika.png
    sources:
      - type: file
        path: verifika
      - type: file
        path: ru.univ.verifika.desktop
      - type: file
        path: ru.univ.verifika.metainfo.xml
      - type: file
        path: 32x32.png
      - type: file
        path: 128x128.png
      - type: file
        path: icon.png
