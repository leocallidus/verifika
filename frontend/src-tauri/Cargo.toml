[package]
name = "verifika"
version = "1.0.0"
description = "Верифика — desktop wrapper"
authors = ["leocallidus"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "verifika_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
# Stronghold-based secret storage. We use it to persist the JWT in OS keychain
# across Win/macOS/Linux. If a deployment target lacks the secret-service
# backend, `tauri-plugin-stronghold` falls back to a local encrypted file.
tauri-plugin-stronghold = "2"

[target."cfg(target_os = \"linux\")".dependencies]
# zbus блокирует stdin/stderr, поэтому включаем `blocking` (а не старый `blocking-api`)
# для прямых D-Bus вызовов ScreenSaver/PowerManagement.
zbus = { version = "4", default-features = false, features = ["blocking", "tokio"] }

[target."cfg(target_os = \"macos\")".dependencies]
# IOPMAssertion to block user idle sleep during a test session.
core-foundation = "0.10"

[target."cfg(target_os = \"windows\")".dependencies]
# Win32 SetThreadExecutionState to keep the system awake during a test.
windows = { version = "0.58", features = ["Win32_System_Power"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
