  <line x1="36" y1="56" x2="46" y2="58" stroke="#94a3b8" stroke-width="0.7"/>
  <line x1="54" y1="55" x2="64" y2="53" stroke="#94a3b8" stroke-width="0.7"/>
  <line x1="54" y1="58" x2="64" y2="56" stroke="#94a3b8" stroke-width="0.7"/>

